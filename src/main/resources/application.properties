spring.application.name=tmapi

# ─── PostgreSQL ──────────────────────────────────────────────────────────────
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/tmapi}
spring.datasource.username=${POSTGRES_USER:tmapi}
spring.datasource.password=${POSTGRES_PASSWORD:tmapi}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool tuning
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false

# ─── Flyway ──────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ─── Redis ───────────────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.cache.type=redis
spring.cache.redis.time-to-live=300000
spring.cache.redis.cache-null-values=false

# ─── JWT ─────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:4b3f9a2c8d1e6f7a0b5c4d3e2f1a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:86400000}

# ─── Async / ThreadPool ───────────────────────────────────────────────────────
app.async.core-pool-size=4
app.async.max-pool-size=16
app.async.queue-capacity=200
app.async.thread-name-prefix=tmapi-async-

# ─── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ─── Scheduler ───────────────────────────────────────────────────────────────
app.scheduler.deadline-check-interval-ms=${DEADLINE_CHECK_INTERVAL_MS:300000}

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.tmapi=INFO
logging.level.org.springframework.security=WARN
